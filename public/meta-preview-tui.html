<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Meta Preview — TUI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: auto;
    }

    #terminal-container {
      display: inline-block;
    }

    #status {
      position: fixed;
      top: 6px;
      right: 10px;
      font-size: 11px;
      color: #333;
      font-family: monospace;
      z-index: 10;
      pointer-events: none;
    }

    #story-label {
      position: fixed;
      top: 6px;
      left: 10px;
      font-size: 11px;
      color: #333;
      font-family: monospace;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="status">connecting…</div>
  <div id="story-label"></div>
  <div id="terminal-container"></div>

  <script>
    const status     = document.getElementById('status');
    const storyLabel = document.getElementById('story-label');
    const container  = document.getElementById('terminal-container');

    const term = new Terminal({
      fontFamily:  'Terminus, "Terminus (TTF)", monospace',
      fontSize:    14,
      theme:       { background: '#000000', foreground: '#ffffff' },
      cursorStyle: 'bar',
      cursorBlink: false,
      scrollback:  0,
    });

    term.open(container);

    function hexToRgb(hex) {
      const n = parseInt(hex.replace('#', ''), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function gridToAnsi({ cols, rows, cells }) {
      // Disable auto-wrap so rows never spill onto the next line
      let out = '\x1b[?7l';
      for (let y = 0; y < rows; y++) {
        out += `\x1b[${y + 1};1H`; // absolute row position, column 1
        for (let x = 0; x < cols; x++) {
          const { char, fg, bg } = cells[y][x];
          const [fr, fg2, fb] = hexToRgb(fg);
          const [br, bg2, bb] = hexToRgb(bg);
          out += `\x1b[38;2;${fr};${fg2};${fb}m`;
          out += `\x1b[48;2;${br};${bg2};${bb}m`;
          out += char;
        }
      }
      out += '\x1b[0m';  // reset colours
      out += '\x1b[?7h'; // re-enable auto-wrap
      return out;
    }

    function renderGrid(tuiData) {
      // Resize the terminal to exactly match the grid dimensions
      term.resize(tuiData.cols, tuiData.rows);
      term.write('\x1b[2J');
      term.write(gridToAnsi(tuiData));
    }

    function connect() {
      const ws = new WebSocket(`ws://${location.host}`);

      ws.addEventListener('open', () => {
        ws.send(JSON.stringify({ type: 'register', role: 'tui-preview' }));
        status.textContent = 'connected';
      });

      ws.addEventListener('message', ({ data }) => {
        let msg;
        try { msg = JSON.parse(data); } catch { return; }
        if (msg.type !== 'story-rendered' || !msg.tuiData) return;
        storyLabel.textContent = `${msg.kind} / ${msg.name}`;
        renderGrid(msg.tuiData);
      });

      ws.addEventListener('close', () => {
        status.textContent = 'disconnected — retrying…';
        setTimeout(connect, 2000);
      });

      ws.addEventListener('error', () => ws.close());
    }

    connect();
  </script>
</body>
</html>
